<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoppeliaSim MCP architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Geist', sans-serif; padding: 32px; }
    main { max-width: 1280px; min-width: 0; margin: auto; }
    h1 { font: 400 28px 'Instrument Serif', serif; margin: 0 0 16px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
<main>
  <h1>CoppeliaSim MCP architecture</h1>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">CoppeliaSim MCP architecture</title>
      <desc id="architecture-desc">An MCP client calls the server, which uses the runner and CoppeliaSim ZeroMQ Remote API; the runner captures two local snapshot files.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>
      <text x="80" y="68" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="1.6" fill="#4f5d75">SYSTEM OVERVIEW</text>
      <text x="80" y="112" font-family="'Instrument Serif', serif" font-size="28" fill="#2d3142">One call, observable scene</text>
      <text x="80" y="144" font-family="'Geist', sans-serif" font-size="12" fill="#4f5d75">Agent request to simulator state, then two local camera views.</text>

      <!-- Connections are drawn before nodes. -->
      <line x1="280" y1="312" x2="360" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="312" x2="640" y2="312" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="840" y1="312" x2="920" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="740" y1="368" x2="740" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="300" y="288" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="297" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">STDIO</text>
      <rect x="578" y="288" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="600" y="297" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">PYTHON</text>
      <rect x="857" y="288" width="46" height="12" rx="2" fill="#f5f5f5"/><text x="880" y="297" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#2e5aa8">ZMQ API</text>
      <rect x="750" y="396" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="772" y="405" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">SAVES</text>

      <rect x="80" y="256" width="200" height="112" rx="6" fill="#f5f5f5"/><rect x="80" y="256" width="200" height="112" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
      <rect x="92" y="268" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/><text x="116" y="279" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">INPUT</text>
      <text x="180" y="316" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">MCP client</text>
      <text x="180" y="338" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">omp / Claude Desktop</text>

      <rect x="360" y="256" width="200" height="112" rx="6" fill="#f5f5f5"/><rect x="360" y="256" width="200" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <rect x="372" y="268" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#eb6c36"/><text x="392" y="279" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#a14b29">TOOL</text>
      <text x="460" y="316" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">MCP server</text>
      <text x="460" y="338" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">coppelia_step</text>

      <rect x="640" y="256" width="200" height="112" rx="6" fill="#f5f5f5"/><rect x="640" y="256" width="200" height="112" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="652" y="268" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/><text x="676" y="279" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">LOCAL</text>
      <text x="740" y="316" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Python runner</text>
      <text x="740" y="338" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">runner.py</text>

      <rect x="920" y="256" width="240" height="112" rx="6" fill="#f5f5f5"/><rect x="920" y="256" width="240" height="112" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="932" y="268" width="64" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/><text x="964" y="279" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">SIMULATOR</text>
      <text x="1040" y="316" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">CoppeliaSim</text>
      <text x="1040" y="338" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">localhost:23000</text>

      <rect x="640" y="448" width="200" height="96" rx="6" fill="#f5f5f5"/><rect x="640" y="448" width="200" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      <rect x="652" y="460" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/><text x="672" y="471" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">FILES</text>
      <text x="740" y="500" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Camera snapshots</text>
      <text x="740" y="520" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">top-down + isometric</text>

      <line x1="80" y1="648" x2="1200" y2="648" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="80" y="676" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">KEY</text>
      <line x1="144" y1="672" x2="176" y2="672" stroke="#2e5aa8" stroke-width="1.2"/><text x="188" y="676" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">Remote API</text>
      <line x1="320" y1="672" x2="352" y2="672" stroke="#4f5d75" stroke-dasharray="5,4"/><text x="364" y="676" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">Local image files</text>
      <text x="824" y="676" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">Response: JSON + snapshot paths when available</text>
    </svg>
  </div>
</main>
</body>
</html>
