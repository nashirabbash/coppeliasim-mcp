[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coppeliasim-mcp"
version = "0.1.0"
description = "High-efficiency MCP server for CoppeliaSim robotics simulation with multimodal dual-camera feedback."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nashir Abbas"}]
dependencies = [
    "mcp>=1.3.0",
    "pyzmq>=25.0.0",
    "cbor2>=5.4.0",
    "pillow>=10.0.0"
]

[project.scripts]
coppeliasim-mcp = "coppeliasim_mcp.coppelia_mcp:main"

[tool.setuptools]
py-modules = ["coppelia_mcp", "runner"]

[tool.setuptools.packages.find]
where = ["."]
include = ["coppeliasim_mcp*"]

[tool.setuptools.data-files]
"share/coppeliasim-mcp/scripts" = ["scripts/coppelia_launch.sh", "scripts/coppelia_ros2_container.sh"]
"share/coppeliasim-mcp/docker/ros2" = ["docker/ros2/Dockerfile"]
